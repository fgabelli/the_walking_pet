<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Area Riservata - The Walking Pet</title>
    <link rel="stylesheet" href="style.css?v=4">
</head>

<body style="height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg-soft);">

    <div class="container">
        <div
            style="max-width: 400px; margin: 0 auto; background: white; padding: 40px; border-radius: var(--radius-md); box-shadow: var(--shadow-md); text-align: center;">
            <a href="index.html"
                style="text-decoration: none; font-size: 2rem; margin-bottom: 20px; display: block;">🐾</a>
            <h2 style="margin-bottom: 10px;">Area Riservata</h2>
            <p style="color: var(--text-light); margin-bottom: 30px;">Accedi al pannello di gestione</p>

            <form id="loginForm" onsubmit="handleLogin(event)">
                <div style="margin-bottom: 20px; text-align: left;">
                    <label style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 8px;">ID
                        Utente</label>
                    <input type="text" id="username" class="form-input"
                        style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;"
                        placeholder="admin">
                </div>
                <div style="margin-bottom: 30px; text-align: left;">
                    <label
                        style="font-weight: bold; font-size: 0.9rem; display: block; margin-bottom: 8px;">Password</label>
                    <input type="password" id="password" class="form-input"
                        style="width: 100%; padding: 12px; border: 1px solid #ddd; border-radius: 8px;"
                        placeholder="••••••••">
                </div>
                <button type="submit" class="btn btn-primary" style="width: 100%;">Accedi</button>
            </form>
            <p id="errorMsg" style="color: red; margin-top: 15px; font-size: 0.9rem; display: none;">Credenziali errate
            </p>
        </div>
    </div>

    <script>
        function handleLogin(e) {
            e.preventDefault();
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;

            // Simple client-side check as requested (insecure but functional for demo static site)
            if (u === 'admin' && p === 'WalkingPet2024!') {
                localStorage.setItem('isAdmin', 'true');
                window.location.href = 'admin/dashboard.html';
            } else {
                document.getElementById('errorMsg').style.display = 'block';
            }
        }
    </script>
</body>

</html>
